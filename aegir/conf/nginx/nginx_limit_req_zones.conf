### /etc/nginx/conf.d/limit-req-zones-boa.conf
###
### BOA-managed http-scope rate-limit zones. DO NOT REMOVE THIS FILE:
### rendered vhost includes reference these zones once the file exists;
### removing it breaks `nginx -t` box-wide on the next verify, and the
### upgrade path restarts nginx without a configtest. Hand-edits are
### overwritten by the barracuda updater.
###
### bgp_flood bounds the D7 background_process/background_batch self-request
### storm class on /bgp-start/: per-vhost aggregate, sized above the worst
### legitimate cadence (a few concurrently-chaining batches plus a cron
### fan-out burst) so only a runaway re-dispatch wall is ever throttled.
### Consumers in the per-instance vhost include render only when this file
### is present, so delivery order can never produce an undeclared-zone
### reference.
limit_req_zone  $host  zone=bgp_flood:1m  rate=5r/s;

### boa_perhost_anon bounds how many uncached renders a single vhost may hold
### SIMULTANEOUSLY, for anonymous traffic only.  It exists because one observed
### flood class is unclassifiable at the request level: a distributed scraper
### swarm presenting one spoofed browser user-agent drove ~270 client IPs at
### ~1.4 requests each against a single vhost, every response a 200 from
### ordinary content routes.  It is not an AI vendor, not a declared bot (so it
### receives the short human cache window, not the long crawler one), not
### bad-status, and far too thin per IP for any per-IP control -- every
### individual request is indistinguishable from a real visitor.  The renders
### pile up until each takes longer than the front cache's own TTL and lock
### timeout, at which point waiting requests stop waiting and render too, and
### the cache stops being able to absorb the herd at all.  Capping the in-flight
### count keeps render time inside that horizon, which is what keeps the front
### cache working; it is deliberately the one control that does not classify
### the client, because this class cannot be classified.
###
### The key is $host for anonymous requests and EMPTY for authenticated ones,
### so an editor or admin is never shed while a flood is being trimmed.  The
### session-cookie test is duplicated here rather than reusing the master
### render's $cache_uid on purpose: keeping this file self-contained is what
### makes the zone safe to declare from BOA, so no provision/BOA delivery order
### can produce an undeclared-zone reference (a box-wide nginx [emerg], on an
### upgrade path that restarts nginx without a configtest).  It mirrors the
### $cache_uid regex in provision's server.tpl.php -- keep the two in step.
### The trailing [[:graph:]] is required, not cosmetic: it makes this test a
### true mirror of $cache_uid, which captures (?<session_id>[[:graph:]]+) and
### is therefore empty -- i.e. anonymous -- for a valueless "SESSxxx=" cookie.
### Without it the two guardrails disagree about that request.  10m matches the
### boa_i18n_anon zone this is modelled on (bgp_flood's 1m is a rate zone with
### far fewer live keys).
map $http_cookie $boa_perhost_anon_key {
  default                          $host;
  ~SESS[[:alnum:]]+=[[:graph:]]    "";
}
limit_conn_zone $boa_perhost_anon_key  zone=boa_perhost_anon:10m;

### boa_grav_anon bounds simultaneous front-controller renders per Grav
### vhost, anonymous traffic only -- the same unclassifiable-flood rationale
### as boa_perhost_anon above, restated for a CMS whose session cookie is
### USELESS as an anonymity test: Grav starts a session and (re)sends its
### cookie on EVERY response, so a Drupal-shaped cookie-presence key would
### count nobody and cap nothing.  The reliable admin-area marker is the
### session name's "-admin" SUFFIX (Grav splits admin sessions into
### <name>-<hex-fingerprint>-admin), and API clients carry an Authorization
### header; both classes are exempted so an editor or API consumer is never
### shed while a flood is trimmed.  The suffix match is deliberately tight
### (name prefix + hex fingerprint + suffix): a loose "-admin" match would
### hand every client a one-cookie bypass.  The 7-or-32 hex alternation
### covers both session.uniqueness modes; a tenant who renames session.name
### degrades to admin-counted-as-anonymous during a flood -- degraded, never
### broken.  Exemption is over-inclusive in the safe direction: an anonymous
### /admin visitor also carries the -admin cookie.  Self-contained on
### purpose, like every zone in this file; consumers gate on this zone's
### presence in this file before referencing it.
map $http_cookie $boa_grav_admin_cookie {
  default                                                                    0;
  "~*(?:^|;\s*)grav-[-_a-z0-9]{0,32}-(?:[0-9a-f]{7}|[0-9a-f]{32})-admin="    1;
}
map $http_authorization $boa_grav_has_auth {
  default  1;
  ""       0;
}
map "$boa_grav_admin_cookie$boa_grav_has_auth" $boa_grav_anon_key {
  default  "";
  "00"     $host;
}
limit_conn_zone $boa_grav_anon_key  zone=boa_grav_anon:10m;

### boa_grav_fe_https translates the local HTTPS front's X-Forwarded-Proto
### into the HTTPS fastcgi param for cert-less Grav vhosts.  Grav emits
### ABSOLUTE URLs from the request scheme, its 2.0 default refuses the
### X-Forwarded-Proto header app-side (anti-spoofing change from 1.7), and
### the REQUEST_SCHEME fallback its Uri layer reads never reaches FPM under
### this stack -- so without this map a proxied https page carries http://
### links and the session cookie loses its Secure flag.  The trust decision
### matches the front's own contract: the header is only meaningful from the
### on-box proxy; a client spoofing it on port 80 changes only the URLs it
### is itself served.  Consumers gate on this map's presence in this file.
map $http_x_forwarded_proto $boa_grav_fe_https {
  default  "";
  https    on;
}
