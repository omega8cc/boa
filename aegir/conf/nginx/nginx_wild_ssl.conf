
### /var/aegir/config/server_master/nginx/pre.d/nginx_wild_ssl.conf

upstream nginx_http {
  server  127.0.0.1:80;
}

### Per-IP in-flight CONNECTION cap for the proxied HTTPS path. Here
### $remote_addr is the real visitor (http-scope realip resolves
### Cloudflare-fronted peers; direct scanners are the raw peer), so this
### restores the per-IP connection ceiling the port-80 vhosts cannot apply to
### this traffic - they see peer 127.0.0.1, so their limreq/search_limit zones
### deliberately skip loopback keys. This reconstitutes only the connection
### dimension (the limreq equivalent); the per-IP search request-RATE cap
### (search_limit 3r/s) is intentionally not rebuilt here - proxied search is
### bounded instead by the per-vhost search_flood cap and by the IDS, which now
### sees the real visitor via the access_log below.
limit_conn_zone $binary_remote_addr zone=boa_wild_front:10m;

server {
  listen                       127.0.0.1:443 ssl;
  listen                       127.0.0.1:443 quic reuseport;
  http2                        on;
  http3                        on;
  http3_hq                     on;
  server_name                  _;
  ssl_dhparam                  /etc/ssl/private/nginx-wild-ssl.dhp;
  ssl_certificate              /etc/ssl/private/nginx-wild-ssl.crt;
  ssl_certificate_key          /etc/ssl/private/nginx-wild-ssl.key;
  ssl_session_timeout          5m;
  ssl_conf_command Options     KTLS;
  ### Log into the same file/format the IDS tails, with $remote_addr already
  ### realip-resolved to the real visitor: proxied HTTPS traffic becomes
  ### visible and scorable, and every status this front mints (444 sheds,
  ### 502s from backend empty-reply conversions) is attributable by
  ### timestamp + host + URI instead of vanishing.
  access_log                   /var/log/nginx/access.log main;
  log_not_found                off;
  ###
  ### Enforce IDS bans at the door. The port-80 vhosts test $is_banned too,
  ### but on this proxied path they see peer 127.0.0.1 and never match - the
  ### ban must bite here, where $remote_addr is the real visitor.
  ###
  if ($is_banned) {
    return 444;
  }
  ###
  ### Deny known crawlers.
  ###
  if ($is_crawler) {
    return 444;
  }
  location / {
    limit_conn                 boa_wild_front 88;
    limit_conn_status          444;
    proxy_pass                 http://nginx_http;
    proxy_http_version         1.1;
    proxy_set_header           Connection        "";
    proxy_redirect             off;
    gzip_vary                  off;
    proxy_buffering            off;
    proxy_set_header           Host              $host;
    proxy_set_header           X-Real-IP         $remote_addr;
    proxy_set_header           X-Forwarded-By    $server_addr:$server_port;
    proxy_set_header           X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header           X-Local-Proxy     $scheme;
    proxy_set_header           X-Forwarded-Proto $scheme;
    proxy_pass_header          Set-Cookie;
    proxy_pass_header          Cookie;
    proxy_pass_header          X-Accel-Expires;
    proxy_pass_header          X-Accel-Redirect;
    proxy_pass_header          X-This-Proto;
    proxy_connect_timeout      180;
    proxy_send_timeout         180;
    proxy_read_timeout         180;
  }
}
