
group = www-data
listen.owner = www-data
listen.group = www-data
listen.mode = 0600
listen.allowed_clients = 127.0.0.1

pm = ondemand
pm.process_idle_timeout = 10s
pm.max_requests = 5000
pm.status_path = /fpm-status
ping.path = /fpm-ping
ping.response = pong
slowlog = /var/log/php/fpm-$pool-slow.log
request_slowlog_timeout = 10s
listen.backlog = 65535

; Workers cannot create files in /var/log/php (root only), so the PHP errors a
; worker raises go to the master's root-only log instead, each line tagged by
; the master with the pool name: "[pool NAME] child PID said into stderr".
catch_workers_output = yes

env[HOSTNAME] = $HOSTNAME
env[PATH] = /usr/local/bin:/usr/bin:/bin

php_admin_value[default_socket_timeout] = 180
php_admin_value[max_execution_time] = 180
php_admin_value[max_input_time] = 180
php_admin_value[memory_limit] = 395M

php_admin_value[opcache.error_log] = /var/log/php/opcache-$pool-error.log
php_admin_value[opcache.log_verbosity_level] = 1

; APCu is on by its own default (apc.enabled). A pool line setting it fails in
; every new worker of a PHP built without APCu, and the master logs each one.

