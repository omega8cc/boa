# BOA monitor incident logs. Rotated weekly and kept small so the emailed
# incident reports (which send only the last 200 lines, see the monitor scripts'
# _incident_email_report) stay focused on the current incident, and the files do
# not grow without bound (high.load.incident.log has been seen at ~2 MB). Written
# by short-lived monitor scripts that reopen the log on each append, so
# logrotate's default create-after-rotate is safe here — no postrotate signal or
# copytruncate is needed.
/var/log/boa/*.incident.log {
        rotate 4
        weekly
        missingok
        notifempty
        compress
        delaycompress
}

# Harvest detector report log. Rotated daily rather than weekly because it is
# the one monitor log whose volume scales with an attack rather than with time:
# a tripped cohort writes one line per contributing address, up to the per-pass
# address cap, and a pass can run once a minute for as long as the harvest
# lasts. Same append-and-close pattern as the incident logs, so the default
# create-after-rotate needs no postrotate signal.
/var/xdrago/monitor/log/harvest.log {
        rotate 7
        daily
        missingok
        notifempty
        compress
        delaycompress
}

# Firewall-guard debug logs (guest-fire's _verbose_log family). Unrotated
# historically because the fleet-normal SILENT mode wrote only the INVALID
# line; with _NGINX_DOS_LOG=NORMAL (the .debug.monitor.log.cnf fold's landing
# value) the DENY/DENIED arms open too, and a flooded box can grow these
# without bound — one line per address per port on a per-minute cron. The
# glob also covers the VERBOSE-only files should an operator enable them.
# Attack-scaled volume gets the daily cadence, same as harvest.log above.
/var/log/csf_*_debug.log {
        rotate 7
        daily
        missingok
        notifempty
        compress
        delaycompress
}
