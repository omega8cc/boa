# ===========================
# Kernel and Networking Settings
# ===========================

# ---------------------------
# IPv4 Security Enhancements
# ---------------------------

# Avoid a smurf attack by ignoring ICMP echo requests to broadcast addresses
net.ipv4.icmp_echo_ignore_broadcasts = 1

# Protect against bogus ICMP error messages
net.ipv4.icmp_ignore_bogus_error_responses = 1

# Enable SYN cookies to protect against SYN flood attacks
net.ipv4.tcp_syncookies = 1

# Disable logging of spoofed, source-routed, and redirect packets
net.ipv4.conf.all.log_martians = 0
net.ipv4.conf.default.log_martians = 0

# Prevent source routed packets
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0

# Enable Reverse Path Filtering to prevent IP spoofing
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

# Disable acceptance of ICMP redirects
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0

# Prevent the system from acting as a router
net.ipv4.ip_forward = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0

# ---------------------------
# IPv6: Complete Disablement
# ---------------------------

# Disable IPv6 for all network interfaces
net.ipv6.conf.all.disable_ipv6 = 1
net.ipv6.conf.default.disable_ipv6 = 1
net.ipv6.conf.lo.disable_ipv6 = 1

# Ensure no IPv6 router solicitations or advertisements are accepted
net.ipv6.conf.default.router_solicitations = 0
net.ipv6.conf.default.accept_ra_rtr_pref = 0
net.ipv6.conf.default.accept_ra_pinfo = 0
net.ipv6.conf.default.accept_ra_defrtr = 0
net.ipv6.conf.default.autoconf = 0
net.ipv6.conf.default.dad_transmits = 0
net.ipv6.conf.default.max_addresses = 1

# ---------------------------
# TCP/IP Networking Tweaks
# ---------------------------

# Decrease the TIME_WAIT timeout to free up ports quicker
net.ipv4.tcp_fin_timeout = 15

# Tune TCP keepalive settings
net.ipv4.tcp_keepalive_time = 300       # Time before sending keepalive probes (seconds)
net.ipv4.tcp_keepalive_probes = 5       # Number of probes before dropping the connection
net.ipv4.tcp_keepalive_intvl = 15       # Interval between keepalive probes (seconds)

# Optimize for SPDY/HTTP2 performance by disabling slow start after idle
net.ipv4.tcp_slow_start_after_idle = 0

# Increase the range of local ports available for outbound connections
net.ipv4.ip_local_port_range = 2000 65000

# Increase the maximum number of tracked connections for conntrack
net.netfilter.nf_conntrack_max = 512000

# Increase TCP buffer sizes for better performance on high bandwidth-delay product (BDP) paths
net.ipv4.tcp_rmem = 4096 87380 8388608
net.ipv4.tcp_wmem = 4096 87380 8388608

# Enable TCP window scaling
net.ipv4.tcp_window_scaling = 1

# Protect against CVE-2016-5696 by adjusting TCP challenge ACK limit
net.ipv4.tcp_challenge_ack_limit = 1073741823

# Enable TCP Fast Open for reduced latency on repeated connections
net.ipv4.tcp_fastopen = 3

# Increase the maximum number of queued SYN requests
net.ipv4.tcp_max_syn_backlog = 4096

# Enable TCP timestamps to improve TCP performance
net.ipv4.tcp_timestamps = 1

# Optionally disable TCP SACK (Selective Acknowledgments) to enhance security
# Note: Enabling SACK can improve performance, but disabling it can enhance security
# Uncomment the following line if you prefer to disable SACK
# net.ipv4.tcp_sack = 0

# ---------------------------
# System Performance Enhancements
# ---------------------------

# Increase the maximum number of open files
fs.file-max = 2097152

# Increase the maximum number of asynchronous I/O operations
fs.aio-max-nr = 2097152

# Increase the number of inotify watches for better lsyncd support
fs.inotify.max_user_watches = 65536

# Increase maximum number of bytes queued on input side of network stack
net.core.netdev_max_backlog = 65536

# Increase the maximum number of incoming connections that can be queued for acceptance
net.core.somaxconn = 512

# Increase the maximum receive and send buffer sizes for all protocols
net.core.rmem_max = 8388608
net.core.wmem_max = 8388608

# Set default TCP buffer sizes
net.core.rmem_default = 262144
net.core.wmem_default = 262144

# ---------------------------
# Virtual Memory Settings
# ---------------------------

# Reduce swappiness to favor RAM usage over swap
vm.swappiness = 1

# Lower the tendency of the kernel to reclaim memory used for caching of directory and inode objects
vm.vfs_cache_pressure = 50

# Set the minimum virtual address that a process is allowed to mmap
vm.mmap_min_addr = 4096

# Disable memory overcommitment to prevent processes from allocating more memory than available
vm.overcommit_ratio = 0
vm.overcommit_memory = 0

# ---------------------------
# Filesystem Protections
# ---------------------------

# Enable protections against hardlink and symlink attacks
fs.protected_hardlinks = 1
fs.protected_symlinks = 1

# ---------------------------
# Security Enhancements
# ---------------------------

# Enable Address Space Layout Randomization (ASLR) for enhanced security
kernel.randomize_va_space = 2

# Limit the noise printed in the console to essential messages only
kernel.printk = 4 1 1 7

# Disable the use of core dumps for security reasons
# Prevents sensitive information from being written to disk
kernel.core_pattern = |/bin/false

# Disable the execution of set-user-ID and set-group-ID programs
# Mitigates certain privilege escalation attacks
fs.suid_dumpable = 0

# Prevent non-root users from writing to kernel message buffer
kernel.dmesg_restrict = 1

# Restrict access to /proc/kcore and other sensitive files
# Prevents non-root users from accessing kernel memory information
kernel.kptr_restrict = 2

# Disable the ability to load kernel modules (optional)
# Requires manual enabling if needed
# kernel.modules_disabled = 1

# ---------------------------
# Additional Networking Optimizations for Cloud Environments (Linode)
# ---------------------------

# Increase the number of ephemeral ports
net.ipv4.ip_local_port_range = 2000 65000

# Enable TCP Fast Open for both client and server
net.ipv4.tcp_fastopen = 3

# Reduce the number of times the system retries SYN packets
net.ipv4.tcp_synack_retries = 2

# ---------------------------
# End of sysctl.conf
# ===========================
