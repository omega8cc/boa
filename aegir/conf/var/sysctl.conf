# =============================================================================
# sysctl.conf - Kernel parameter tuning for KVM/QEMU virtual machines
# Target: Devuan Daedalus 5.x (Linux kernel 6.1 LTS / Debian Bookworm base)
# Compatible with: Linux 4.9+ (all settings verified for kernel 6.1)
#
# Apply changes with:   sysctl -p /etc/sysctl.conf
# Verify a value with:  sysctl <parameter.name>
#
# Sections:
#   1. IPv4 Security Hardening
#   2. IPv6 Disablement
#   3. TCP/IP Performance Tuning
#   4. Network Buffer Sizes
#   5. Virtual Memory
#   6. Filesystem & Process Limits
#   7. Kernel Security Hardening
# =============================================================================


# -----------------------------------------------------------------------------
# 1. IPv4 Security Hardening
# -----------------------------------------------------------------------------

# Ignore ICMP echo requests sent to broadcast addresses (smurf attack defence)
net.ipv4.icmp_echo_ignore_broadcasts = 1

# Suppress bogus ICMP error responses that could be used for OS fingerprinting
net.ipv4.icmp_ignore_bogus_error_responses = 1

# Enable SYN cookies to withstand SYN flood attacks without dropping connections
net.ipv4.tcp_syncookies = 1

# Log martian packets (packets with impossible source addresses).
# Useful for detecting spoofing attempts; generates some log noise on noisy
# networks. Set to 0 if log verbosity is a concern.
net.ipv4.conf.all.log_martians = 1
net.ipv4.conf.default.log_martians = 1

# Reject source-routed packets (attacker-controlled routing)
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0

# Strict Reverse Path Filtering: drop packets whose source address has no
# return route through the interface they arrived on. Prevents IP spoofing.
# Use rp_filter = 2 (loose mode) only if asymmetric routing is required.
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

# Reject ICMP redirect messages (could be used to alter routing tables)
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0

# Reject "secure" redirects as well (redirects from listed gateways only)
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0

# Do not forward traffic between interfaces (this is not a router)
net.ipv4.ip_forward = 0

# Do not send ICMP redirects (only relevant on routers)
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0

# Protect against TIME_WAIT assassination (RFC 1337).
# Drops RST packets for sockets in TIME_WAIT state.
net.ipv4.tcp_rfc1337 = 1


# -----------------------------------------------------------------------------
# 2. IPv6 Disablement
# -----------------------------------------------------------------------------
# Remove this section entirely if IPv6 is needed. If keeping IPv6, replace
# these with appropriate security settings instead of wholesale disablement.

# Disable IPv6 on all interfaces including loopback
net.ipv6.conf.all.disable_ipv6 = 1
net.ipv6.conf.default.disable_ipv6 = 1
net.ipv6.conf.lo.disable_ipv6 = 1

# The following are redundant when disable_ipv6 = 1 but are kept as a
# defence-in-depth measure in case IPv6 is re-enabled without removing this file
net.ipv6.conf.default.router_solicitations = 0
net.ipv6.conf.default.accept_ra_rtr_pref = 0
net.ipv6.conf.default.accept_ra_pinfo = 0
net.ipv6.conf.default.accept_ra_defrtr = 0
net.ipv6.conf.default.autoconf = 0
net.ipv6.conf.default.dad_transmits = 0
net.ipv6.conf.default.max_addresses = 1


# -----------------------------------------------------------------------------
# 3. TCP/IP Performance Tuning
# -----------------------------------------------------------------------------

# Use BBR (Bottleneck Bandwidth and RTT) congestion control.
# BBR significantly improves throughput in virtualised environments compared
# to the default CUBIC algorithm. Requires the 'fq' packet scheduler below.
# Available since kernel 4.9; present in Daedalus kernel 6.1.
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# How long to wait before closing a socket in FIN_WAIT_2 (seconds).
# Reducing from the 60s default frees ports faster under heavy connection churn.
# Do not go below 15 on systems with load balancers or long-RTT clients.
net.ipv4.tcp_fin_timeout = 20

# TCP keepalive: how long an idle connection is kept before probing begins.
# 300s is a reasonable balance between detecting dead peers and keeping
# long-lived idle connections (e.g. SSH, database pools) alive.
net.ipv4.tcp_keepalive_time = 300
# Number of unacknowledged probes before the connection is declared dead
net.ipv4.tcp_keepalive_probes = 5
# Interval between consecutive keepalive probes (seconds)
net.ipv4.tcp_keepalive_intvl = 15

# Disable slow-start restart after an idle period.
# Prevents throughput degradation for long-lived but bursty connections
# (e.g. HTTP/2 keep-alive, gRPC). Recommended for most server workloads.
net.ipv4.tcp_slow_start_after_idle = 0

# Allow TIME_WAIT sockets to be reused for new outbound connections.
# Safe when tcp_timestamps is enabled (which it is below).
net.ipv4.tcp_tw_reuse = 1

# Ephemeral port range for outbound connections.
# Starting at 1024 (below 1024 requires CAP_NET_BIND_SERVICE anyway) gives
# more ports. The previous value of 2000 wasted the 1024-1999 range.
net.ipv4.ip_local_port_range = 1024 65535

# Maximum queue length for SYN requests awaiting completion of the 3-way
# handshake. Increase for servers handling high connection rates.
net.ipv4.tcp_max_syn_backlog = 4096

# Number of times a SYN-ACK is retransmitted for an incoming connection.
# Reducing from the 5 default shortens the time a half-open connection
# occupies resources before being abandoned.
net.ipv4.tcp_synack_retries = 2

# Enable TCP timestamps (RFC 1323). Required for tcp_tw_reuse to be safe,
# and improves RTT estimation accuracy. Disable only if you have strong
# reasons (e.g. privacy concerns about timestamp-based OS fingerprinting).
net.ipv4.tcp_timestamps = 1

# Enable window scaling (RFC 1323) to support receive windows > 65535 bytes.
# Essential for performance over high-bandwidth or high-latency paths.
net.ipv4.tcp_window_scaling = 1

# Enable TCP Fast Open for both outbound (1) and inbound (2) connections.
# Value 3 = both. Reduces latency for repeated TCP connections by allowing
# data in the SYN packet. Requires application support.
net.ipv4.tcp_fastopen = 3

# Raise the conntrack table size if this VM runs iptables/nftables and
# sees high connection volume. The default (~65k) is often too low.
# Note: this parameter only takes effect if the nf_conntrack module is loaded.
net.netfilter.nf_conntrack_max = 262144

# TCP SACK (Selective Acknowledgments) - leave enabled (default = 1).
# SACK improves recovery from packet loss. The security argument for disabling
# it (a 2019 kernel bug) has been patched in all current kernels.
net.ipv4.tcp_sack = 1


# -----------------------------------------------------------------------------
# 4. Network Buffer Sizes
# -----------------------------------------------------------------------------

# Per-socket TCP receive buffer: min, default, max (bytes)
# 8 MB max gives headroom for high-BDP (bandwidth-delay product) paths
# without wasting memory on idle sockets.
net.ipv4.tcp_rmem = 4096 131072 8388608

# Per-socket TCP send buffer: min, default, max (bytes)
net.ipv4.tcp_wmem = 4096 131072 8388608

# Global maximum socket receive/send buffer (bytes).
# Must be >= the max values in tcp_rmem/tcp_wmem above.
net.core.rmem_max = 8388608
net.core.wmem_max = 8388608

# Default socket receive/send buffer for non-TCP protocols (UDP etc.)
net.core.rmem_default = 262144
net.core.wmem_default = 262144

# Maximum number of packets queued on the input side of a network interface
# before the kernel starts dropping them. Increase for high-throughput NICs.
net.core.netdev_max_backlog = 16384

# Maximum number of connections that can be queued for acceptance per socket.
# nginx/Apache worker queues and similar services benefit from values >= 1024.
net.core.somaxconn = 1024


# -----------------------------------------------------------------------------
# 5. Virtual Memory
# -----------------------------------------------------------------------------

# Swappiness: how aggressively the kernel swaps anonymous memory to disk.
# 0  = swap only to avoid OOM
# 1  = swap as little as possible (original value; risky with limited RAM)
# 10 = sensible minimum for VMs; avoids OOM kills while still preferring RAM
# 60 = kernel default
# For VMs with ample RAM and no swap, 1 is acceptable. For typical VMs,
# 10 reduces the risk of unexpected OOM kills under memory pressure.
vm.swappiness = 10

# vfs_cache_pressure controls how eagerly the kernel reclaims memory used for
# dentries and inodes. Default is 100 (neutral). Values > 100 reclaim more
# aggressively; values < 100 keep more cache. 50 favours retaining the VFS
# cache, which benefits workloads touching many files (web servers, git, etc.)
# The original value of 200 was excessively aggressive for most workloads.
vm.vfs_cache_pressure = 50

# Minimum virtual address for mmap. Prevents null-pointer dereference exploits.
# 4096 = one page. Some hardened profiles set this to 65536.
vm.mmap_min_addr = 65536

# Memory overcommit policy:
#   0 = heuristic (default): the kernel uses an estimate of available memory
#   1 = always allow overcommit (suitable for scientific/HPC workloads)
#   2 = strict: never commit more than (RAM * overcommit_ratio / 100) + swap
# Mode 0 is appropriate for general-purpose VMs.
# overcommit_ratio is only meaningful with mode 2; leaving it at the default
# (50) avoids confusion. The original config set ratio=0 with mode=0 which
# had no effect but implied strict behaviour.
vm.overcommit_memory = 0
# vm.overcommit_ratio = 50   # Only relevant when overcommit_memory = 2


# -----------------------------------------------------------------------------
# 6. Filesystem & Process Limits
# -----------------------------------------------------------------------------

# Maximum number of open file descriptors system-wide.
# Raise if running databases, high-concurrency servers, or many containers.
fs.file-max = 2097152

# Maximum number of concurrent asynchronous I/O operations system-wide.
# Relevant for databases (PostgreSQL, MySQL) that use AIO heavily.
fs.aio-max-nr = 1048576

# Maximum number of inotify watches per user.
# 65536 covers most use cases. Raise to 524288 if running IDEs, webpack,
# lsyncd, or other file-watching tools that exhaust the default.
fs.inotify.max_user_watches = 65536

# Maximum number of inotify event queue entries per inotify instance.
# The default (16384) is usually fine; raise if you see ENOSPC from inotify.
fs.inotify.max_queued_events = 32768

# Protect against hardlink attacks (e.g. TOCTOU in /tmp).
# Prevents users from creating hardlinks to files they do not own.
fs.protected_hardlinks = 1

# Protect against symlink attacks in world-writable sticky directories.
fs.protected_symlinks = 1

# Protect against opening FIFOs in world-writable sticky directories
# by users other than the owner. Available since kernel 4.19.
fs.protected_fifos = 1

# Prevent opening regular files not owned by the user in world-writable
# sticky directories. Available since kernel 4.19.
# 2 = also block writes; 1 = block opens by non-owners
fs.protected_regular = 2

# Disable core dumps for setuid programs. Prevents sensitive memory from
# being written to disk by privilege-dropped processes.
fs.suid_dumpable = 0


# -----------------------------------------------------------------------------
# 7. Kernel Security Hardening
# -----------------------------------------------------------------------------

# Full ASLR: randomise the base addresses of the stack, VDSO, and mmap regions.
# 0 = off, 1 = partial, 2 = full. Always use 2 on production systems.
kernel.randomize_va_space = 2

# Restrict access to the kernel message ring buffer (dmesg) to root only.
# Prevents unprivileged users from gleaning kernel addresses or error details.
kernel.dmesg_restrict = 1

# Hide kernel symbol addresses from unprivileged users.
# 1 = hide from non-root, 2 = hide from all including root (CAP_SYSLOG bypasses).
# kptr_restrict = 2 is the stricter option; use 1 if you need oops reports.
kernel.kptr_restrict = 2

# Restrict ptrace to parent processes (or root). Prevents one unprivileged
# process from attaching to and inspecting another.
# 1 = restricted (recommended), 0 = permissive (default), 3 = disabled entirely
# Note: this is a Debian/Ubuntu-specific sysctl; it may be a no-op on some kernels.
kernel.yama.ptrace_scope = 1

# Suppress most kernel messages on the console. The four values are:
# console_loglevel, default_message_loglevel, min_console_level, default_console_level
# "4 1 1 7" shows KERN_WARNING and above on the console, which is appropriate
# for production VMs to avoid log spam without silencing warnings.
kernel.printk = 4 1 1 7

# Redirect core dumps to /dev/null rather than writing them to disk.
# Prevents potentially sensitive process memory from being captured.
# To re-enable temporarily: sysctl -w kernel.core_pattern=core
kernel.core_pattern = |/bin/false

# Maximum PID value. The default (32768) can be exhausted by systems running
# many threads or containers. 4194304 is the maximum on 64-bit kernels.
kernel.pid_max = 4194304

# Kernel module loading:
# Uncomment the line below only on fully provisioned systems where you are
# certain no additional modules will ever need to be loaded. It is
# irreversible without a reboot.
# kernel.modules_disabled = 1

# =============================================================================
# End of sysctl.conf
# =============================================================================
