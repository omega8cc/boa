# /etc/rsyslog.conf configuration file for rsyslog
#
# For more information install rsyslog-doc and see
# /usr/share/doc/rsyslog-doc/html/configuration/index.html


#################
#### MODULES ####
#################

# provides support for local system logging; every line a program sends on
# the socket carries the sender's real uid as $!uid, which the kernel gives
# with the datagram, never the line
module(load="imuxsock"
       SysSock.Annotate="on"
       SysSock.ParseTrusted="on")
module(load="imklog")   # provides kernel logging support
#module(load="immark")  # provides --MARK-- message capability

# provides UDP syslog reception
#module(load="imudp")
#input(type="imudp" port="514")

# provides TCP syslog reception
#module(load="imtcp")
#input(type="imtcp" port="514")


###########################
#### GLOBAL DIRECTIVES ####
###########################

#
# Use traditional timestamp format.
# To enable high precision timestamps, comment out the following line.
#
$ActionFileDefaultTemplate RSYSLOG_TraditionalFileFormat

#
# Set the default permissions for all log files.
#
$FileOwner root
$FileGroup adm
$FileCreateMode 0640
$DirCreateMode 0755
$Umask 0022

#
# Where to place spool and state files
#
$WorkDirectory /var/spool/rsyslog

#
# Include all config files in /etc/rsyslog.d/
#
$IncludeConfig /etc/rsyslog.d/*.conf


###############
#### RULES ####
###############

#
# A program writing to a log socket names its own facility, tag and pid, so
# only the sender's uid tells who wrote a line. Root's monitors and lfd ban
# addresses, exempt them and judge an SQL outage on what auth.log, messages,
# the kernel's logs and mysqld's lines say, so a line a hosted account wrote
# there would steer them. An account reaches the socket through a setuid
# program that logs its words (sudo's command line) or through a socket it
# connected in the seconds after a restart, before lfd restricts it again.
# So a sender other than root writes its auth, authpriv, ftp and kernel
# lines, and its lines tagged mysqld unless it is the server's own user
# (@MYSQL_UID@ is that uid, written in at install), to /var/log/auth.user.log
# alone, and none of its lines to /var/log/messages. A line with no uid (a
# socket without annotation) is routed as before. su's auth and authpriv
# lines stay in auth.log: su logs as the user who ran it, and those lines
# feed only lfd's su alert mail.
#
if $inputname == "imuxsock" and $!uid != "" and $!uid != "0" then {
  if (prifilt("auth,authpriv,ftp,kern.*")
      and not ($programname == "su" and prifilt("auth,authpriv.*")))
    or ($programname == "mysqld" and $!uid != "@MYSQL_UID@") then {
    action(type="omfile" file="/var/log/auth.user.log"
           template="RSYSLOG_TraditionalFileFormat"
           fileOwner="root" fileGroup="adm" fileCreateMode="0640")
    stop
  }
  set $.notroot = "1";
}

#
# First some standard log files.  Log by facility.
#

# Direct all cron messages to /var/log/cron.log
if $programname == 'CRON' then /var/log/cron.log
& stop

# Log auth and authpriv messages to /var/log/auth.log
auth,authpriv.*        /var/log/auth.log

*.*;kern.!info;\
    cron.!info;\
    mail.!info;\
    auth,authpriv.none     -/var/log/syslog
daemon.*			-/var/log/daemon.log
kern.*;kern.!info      -/var/log/kern.log
lpr.*				-/var/log/lpr.log
mail.*				-/var/log/mail.log
user.*				-/var/log/user.log
kern.info           -/var/log/iptables.log
cron.info			/var/log/cron.log

#
# Logging for the mail system.  Split it up so that
# it is easy to write scripts to parse these files.
#
mail.info			-/var/log/mail.info
mail.warn			-/var/log/mail.warn
mail.err			/var/log/mail.err

#
# Some "catch-all" log files.
#
*.=debug;\
	auth,authpriv.none;\
	mail.none		-/var/log/debug
if $.notroot != "1"
  and prifilt("*.=info;*.=notice;*.=warn;kern.!info;auth,authpriv.none;cron,daemon.none;mail.none") then
  action(type="omfile" file="/var/log/messages"
         template="RSYSLOG_TraditionalFileFormat"
         fileOwner="root" fileGroup="adm" fileCreateMode="0640")

#
# Emergencies are sent to everybody logged in.
#
*.emerg				:omusrmsg:*

