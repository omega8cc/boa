###
### Plain HTTP proxy (START) _oct_uid _oct_mail
###
server {
  listen                       _dedicated_ip:80;
  server_name                  _dedicated_sn;
  ### The file and format the IDS tails: this proxy sees the real visitor.
  access_log                   /var/log/nginx/access.log main;
  log_not_found                off;
  ###
  ### IDS bans: this box's IDS reads this proxy's lines at the real visitor's
  ### address and bans it, but csf sees only the edge of a site behind
  ### Cloudflare, so the ban bites here, as in the HTTPS proxy for the same
  ### address. The host behind this proxy judges every name by its own list.
  ###
  if ($is_banned) {
    return 444;
  }
  ###
  ### Optional permanent redirect to HTTPS per domain/regex
  ###
  if ($host ~* ^(www\.)?(foo\.com)$) {
    return 301 https://$host$request_uri;
  }
  location / {
    ### The host behind this proxy refuses a request (a banned address, a
    ### refused crawler, a probe for a secret path) by closing the connection,
    ### which this proxy would answer with its own 502: drop it here too.
    error_page                 502 = @boa_drop;
    proxy_pass                 http://_target_ip;
    proxy_http_version         1.1;
    proxy_set_header           Connection        "";
    proxy_redirect             off;
    gzip_vary                  off;
    proxy_buffering            off;
    proxy_set_header           Host              $host;
    proxy_set_header           X-Real-IP         $remote_addr;
    proxy_set_header           X-Forwarded-By    $server_addr:$server_port;
    proxy_set_header           X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header           X-Local-Proxy     $scheme;
    # Hand the new host the realip-resolved client so its unchanged
    # `real_ip_header CF-Connecting-IP` recovers it through this migration hop.
    # Overwrite (not add): a client cannot inject a forged header via this proxy.
    proxy_set_header           CF-Connecting-IP  $remote_addr;
    proxy_pass_header          Set-Cookie;
    proxy_pass_header          Cookie;
    proxy_pass_header          X-Accel-Expires;
    proxy_pass_header          X-Accel-Redirect;
    proxy_pass_header          X-This-Proto;
    proxy_connect_timeout      180;
    proxy_send_timeout         180;
    proxy_read_timeout         180;
  }
  location @boa_drop {
    ### Only a close after the request and before any byte of an answer is
    ### such a refusal: nothing listening at the target, an oversized header
    ### or any other fault keeps its 502.
    recursive_error_pages      off;
    if ($upstream_bytes_received !~ "^[0, :]*$") {
      return 502;
    }
    if ($upstream_bytes_sent !~ "[1-9]") {
      return 502;
    }
    return 444;
  }
}
###
### Plain HTTP proxy (END)
###
