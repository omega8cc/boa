###
### Secure HTTPS proxy for _domain_name (START) _oct_uid
###
server {
  listen                       *:443 ssl;
  listen                       *:443 quic;
  http2                        on;
  http3                        on;
  http3_hq                     on;
  server_name                  _;
  ssl_dhparam                  /etc/ssl/private/nginx-wild-ssl.dhp;
  ssl_certificate_key          /data/disk/_oct_uid/config/server_master/ssl.d/_domain_name/openssl.key;
  ssl_certificate              /data/disk/_oct_uid/config/server_master/ssl.d/_domain_name/openssl_chain.crt;
  ssl_trusted_certificate      /data/disk/_oct_uid/tools/le/certs/_domain_name/chain.pem;
  access_log                   off;
  log_not_found                off;
  # The TARGET is the sole ACME issuer for names still resolving to this
  # proxy (the certificate mirror pulls the renewed pair back here), so
  # forward challenges explicitly. https (not port 80): the server-scope
  # 80->443 redirect would otherwise bounce the ACME server with a 301.
  location ^~ /.well-known/acme-challenge {
    proxy_pass                 https://_target_ip;
    proxy_http_version         1.1;
    proxy_set_header           Connection        "";
    proxy_set_header           Host              $host;
    proxy_set_header           X-Real-IP         $remote_addr;
    proxy_set_header           X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header           X-Local-Proxy     $scheme;
    proxy_set_header           X-Forwarded-Proto $scheme;
    # Overwrite, never add: headers are per-location in nginx, so omitting
    # this here would let a client forge the origin's realip source on the
    # one path that is reachable without any other guard.
    proxy_set_header           CF-Connecting-IP  $remote_addr;
  }
  location / {
    proxy_pass                 https://_target_ip;
    proxy_http_version         1.1;
    proxy_set_header           Connection        "";
    proxy_redirect             off;
    gzip_vary                  off;
    proxy_buffering            off;
    proxy_set_header           Host              $host;
    proxy_set_header           X-Real-IP         $remote_addr;
    proxy_set_header           X-Forwarded-By    $server_addr:$server_port;
    proxy_set_header           X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header           X-Local-Proxy     $scheme;
    proxy_set_header           X-Forwarded-Proto $scheme;
    # Hand the new host the realip-resolved client so its unchanged
    # `real_ip_header CF-Connecting-IP` recovers it through this migration hop.
    # Overwrite (not add): a client cannot inject a forged header via this proxy.
    proxy_set_header           CF-Connecting-IP  $remote_addr;
    proxy_pass_header          Set-Cookie;
    proxy_pass_header          Cookie;
    proxy_pass_header          X-Accel-Expires;
    proxy_pass_header          X-Accel-Redirect;
    proxy_pass_header          X-This-Proto;
    proxy_connect_timeout      180;
    proxy_send_timeout         180;
    proxy_read_timeout         180;
  }
}
###
### Secure HTTPS proxy (END)
###
