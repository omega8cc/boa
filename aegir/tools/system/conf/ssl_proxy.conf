###
### Secure HTTPS proxy (START) _oct_uid _oct_mail
###
### The variables of the /user + /admin list included below. The vhost
### behind this proxy loads the same file; nginx takes a second identical
### definition, and this proxy then does not depend on that vhost.
###
include /data/disk/_oct_uid/config/includes/user_admin_access_map/_domain_name.conf*;
server {
  listen                       _dedicated_ip:443 ssl;
  listen                       _dedicated_ip:443 quic;
  http2                        on;
  http3                        on;
  http3_hq                     on;
  server_name                  _dedicated_sn;
  ssl_dhparam                  /etc/ssl/private/_domain_name.dhp;
  ssl_certificate              /etc/ssl/private/_domain_name.crt;
  ssl_certificate_key          /etc/ssl/private/_domain_name.key;
  ssl_session_timeout          5m;
  ssl_prefer_server_ciphers    on;
  ssl_conf_command Options     KTLS;
  keepalive_timeout            70;
  access_log                   on;
  log_not_found                off;
  ###
  ### IDS bans and the IP lists of the site behind this proxy (boa_panel_lock):
  ### its vhost applies them too, but it sees this proxy's own address, which
  ### the lists always admit and no ban names, so they bite here, where
  ### $remote_addr is the real visitor. A proxy for a moved account answers
  ### every name on its address and the new host judges them, so ssl-gen
  ### keeps the ban there and drops the includes.
  ###
  if ($is_banned) {
    return 444;
  }
  include /data/disk/_oct_uid/config/includes/ip_access/_domain_name.conf*;
  include /data/disk/_oct_uid/config/includes/user_admin_access/_domain_name.conf*;
  ###
  ### Loopback-only paths of the vhost behind this proxy (FPM status and
  ### ping, the cron entry points, the stub status): that vhost admits them to
  ### the box's own addresses, and this proxy connects from one, so refuse them
  ### here unless the real visitor is the box itself. Self-contained on
  ### purpose, with the same match as the wildcard front: this file is
  ### regenerated on its own schedule and must not depend on the front's maps.
  ###
  set $boa_panel_local "";
  if ($uri ~ "^/(?:fpm-(?:status|ping)$|(?:core/)?cron\.php$|cron/|[^/]+/cron(?:\.php|/)$|nginx_status)") {
    set $boa_panel_local "path";
  }
  if ($remote_addr = $server_addr) {
    set $boa_panel_local "";
  }
  if ($boa_panel_local = "path") {
    return 403;
  }

  ###
  ### Allow access to SQL Adminer css.
  ### Same allow-list as the content locations: without it the stylesheet
  ### answers anyone and becomes an existence oracle for Adminer.
  ###
  location ^~ /sqladmin/adminer.css {
    alias /var/www/adminer/adminer.css;
    default_type text/css;
    set_real_ip_from 127.0.0.1;
    set_real_ip_from _target_ip;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    include /var/aegir/config/includes/ip_access/sqladmin*;
    try_files $uri =404;
  }

  ###
  ### Allow access to SQL Adminer.
  ###
  location ^~ /sqladmin {
    location ~* ^/sqladmin {
      alias /var/www/adminer;
      set_real_ip_from 127.0.0.1;
      set_real_ip_from _target_ip;
      real_ip_header X-Forwarded-For;
      real_ip_recursive on;
      if ($is_crawler) {
        return 444;
      }
      include /var/aegir/config/includes/ip_access/sqladmin*;
      index  index.php;
      try_files $uri /sqladmin/index.php?$query_string;
    }
  }

  ###
  ### Send all non-static requests to php-fpm.
  ###
  location = /sqladmin/index.php {
    set_real_ip_from 127.0.0.1;
    set_real_ip_from _target_ip;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    if ($is_crawler) {
      return 444;
    }
    include /var/aegir/config/includes/ip_access/sqladmin*;
    alias /var/www/adminer/index.php;
    include fastcgi_params;
    # Block https://httpoxy.org/ attacks.
    fastcgi_param  HTTP_PROXY "";
    fastcgi_param  HTTP_HOST $host;
    fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param  SCRIPT_URL /sqladmin/;
    fastcgi_param  SCRIPT_URI $scheme://$host/sqladmin/;
    fastcgi_param  REDIRECT_STATUS 200;
    fastcgi_index  index.php;
    fastcgi_intercept_errors on;
    try_files $uri =404; ### check for existence of php file first
    fastcgi_pass 127.0.0.1:9000;
  }

  location / {
    proxy_pass                 http://_target_ip;
    proxy_http_version         1.1;
    proxy_set_header           Connection        "";
    proxy_redirect             off;
    gzip_vary                  off;
    proxy_buffering            off;
    proxy_set_header           Host              $host;
    proxy_set_header           X-Real-IP         $remote_addr;
    proxy_set_header           X-Forwarded-By    $server_addr:$server_port;
    proxy_set_header           X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header           X-Local-Proxy     $scheme;
    proxy_set_header           X-Forwarded-Proto $scheme;
    # Hand the new host the realip-resolved client so its unchanged
    # `real_ip_header CF-Connecting-IP` recovers it through this migration hop.
    # Overwrite (not add): a client cannot inject a forged header via this proxy.
    proxy_set_header           CF-Connecting-IP  $remote_addr;
    proxy_pass_header          Set-Cookie;
    proxy_pass_header          Cookie;
    proxy_pass_header          X-Accel-Expires;
    proxy_pass_header          X-Accel-Redirect;
    proxy_pass_header          X-This-Proto;
    proxy_connect_timeout      180;
    proxy_send_timeout         180;
    proxy_read_timeout         180;
  }
}
###
### Secure HTTPS proxy (END)
###
