###
### Plain HTTP proxy (START)
###
server {
  listen                       *:80;
  server_name                  _;
  access_log                   off;
  log_not_found                off;
  ###
  ### HTTPS for a site without its own certificate reaches this vhost
  ### through the wildcard SSL front, which connects from 127.0.0.1 and puts
  ### its real visitor in X-Real-IP. Hand that visitor on, never the hop:
  ### the new host trusts this box's CF-Connecting-IP, and 127.0.0.1 would
  ### pass every loopback allowance there. A caller on this box that sends
  ### no such header forwards none, so the new host sees this box instead.
  ###
  set $boa_mig_client $remote_addr;
  if ($realip_remote_addr = 127.0.0.1) {
    set $boa_mig_client $http_x_real_ip;
  }
  # The TARGET is the sole ACME issuer for names still resolving to this
  # proxy, and the certificate mirror then pulls the renewed pair back here.
  # That entire policy rests on challenges being forwarded, so state it
  # explicitly instead of relying on `location /` catching them: one
  # well-meant "let the old box keep issuing" patch would silently invert it.
  location ^~ /.well-known/acme-challenge {
    proxy_pass                 http://_target_ip;
    proxy_http_version         1.1;
    proxy_set_header           Connection        "";
    proxy_set_header           Host              $host;
    proxy_set_header           X-Real-IP         $boa_mig_client;
    proxy_set_header           X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header           X-Local-Proxy     $scheme;
    # Overwrite, never add: headers are per-location in nginx, so omitting
    # this here would let a client forge the origin's realip source on the
    # one path that is reachable without any other guard.
    proxy_set_header           CF-Connecting-IP  $boa_mig_client;
  }
  location / {
    proxy_pass                 http://_target_ip;
    proxy_http_version         1.1;
    proxy_set_header           Connection        "";
    proxy_redirect             off;
    gzip_vary                  off;
    proxy_buffering            off;
    proxy_set_header           Host              $host;
    proxy_set_header           X-Real-IP         $boa_mig_client;
    proxy_set_header           X-Forwarded-By    $server_addr:$server_port;
    proxy_set_header           X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header           X-Local-Proxy     $scheme;
    # Hand the new host the realip-resolved client (the front's visitor when
    # it came through the wildcard SSL front) so its unchanged
    # `real_ip_header CF-Connecting-IP` recovers it through this migration hop.
    # Overwrite (not add): a client cannot inject a forged header via this proxy.
    proxy_set_header           CF-Connecting-IP  $boa_mig_client;
    proxy_pass_header          Set-Cookie;
    proxy_pass_header          Cookie;
    proxy_pass_header          X-Accel-Expires;
    proxy_pass_header          X-Accel-Redirect;
    proxy_pass_header          X-This-Proto;
    proxy_connect_timeout      180;
    proxy_send_timeout         180;
    proxy_read_timeout         180;
  }
}
###
### Plain HTTP proxy (END)
###
